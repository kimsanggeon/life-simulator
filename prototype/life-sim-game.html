<style>

:root{
  --bg:#E7ECE8; --paper:#FAFBF8; --ink:#1C2724; --muted:#5E6B66; --line:#CBD4CF;
  --accent:#2747C4; --accent-ink:#FFFFFF; --mark:#F2C230;
  --good:#1F8A5B; --bad:#C2412D;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --paper:#1A221F; --ink:#E5ECE8; --muted:#97A49F; --line:#2E3934;
  --accent:#7D94FF; --accent-ink:#0F1530; --mark:#D9AE38; --good:#4CC28A; --bad:#F07A63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --paper:#1A221F; --ink:#E5ECE8; --muted:#97A49F; --line:#2E3934;
  --accent:#7D94FF; --accent-ink:#0F1530; --mark:#D9AE38; --good:#4CC28A; --bad:#F07A63; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{font-size:1.5rem}
.brand small{color:var(--muted);font-size:.85rem}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px}
.status{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.stamp{width:84px;height:84px;border-radius:50%;border:2.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;text-align:center;transform:rotate(-8deg);font-family:var(--f-display)}
.stamp b{display:block;font-size:2rem;line-height:1;font-weight:400}
.stamp span{font-size:.75rem;letter-spacing:.06em}
.gauges{display:grid;gap:7px;min-width:0}
.g{display:grid;grid-template-columns:3.2em 1fr 4.6em;gap:8px;align-items:center;font-size:.86rem}
.g .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .5s ease}
.g.low .bar i{background:var(--bad)}
.g .v{font-family:var(--f-num);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.money{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.9rem;display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:4px;padding-top:7px}
.money b.neg{color:var(--bad)}
.job{color:var(--muted);font-size:.85rem}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 8px;margin-bottom:8px}
.event h2{font-size:1.55rem;margin-bottom:8px}
.event h2 mark{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit}
.event p{margin:0 0 16px}
.choices{display:grid;gap:8px}
button{font:inherit;cursor:pointer}
.choice{text-align:left;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:5px;padding:11px 14px;transition:background .15s,transform .1s}
.choice:hover:not(:disabled){background:var(--bg)}
.choice:active:not(:disabled){transform:translateY(1px)}
.choice:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}
.choice small{display:block;color:var(--muted);font-size:.78rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:5px;padding:12px 18px;font-family:var(--f-display);font-size:1.1rem}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:5px;padding:10px 16px}
.result{border-left:3px solid var(--accent);padding-left:12px;margin:0 0 14px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.d{font-family:var(--f-num);font-size:.78rem;padding:2px 8px;border-radius:3px;border:1px solid currentColor}
.d.up{color:var(--good)} .d.dn{color:var(--bad)}
.log h3{font-size:1.05rem;margin-bottom:8px}
.log ol{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.88rem}
.log li{display:grid;grid-template-columns:3.2em 1fr;gap:8px;color:var(--muted)}
.log li b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:.85rem;color:var(--muted)}
input[type=text]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:5px;padding:9px}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--bg);font-weight:700}
.intro p{margin:0 0 14px}
.card{border:2px solid var(--ink);border-radius:8px;padding:20px;display:grid;gap:10px;background:var(--paper)}
.card .who{font-family:var(--f-num);font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.card h2{font-size:1.9rem}
.card .line{font-size:1rem}
.card .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;border-top:1px dashed var(--line);padding-top:10px}
.card .stats div{font-size:.75rem;color:var(--muted)}
.card .stats b{display:block;font-family:var(--f-num);font-size:1rem;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.toast{font-size:.85rem;color:var(--good);min-height:1.2em}
.collect{font-size:.85rem;color:var(--muted)}
.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.g .bar i{transition:none}}
</style>

// ===== 상태 =====
let S, pending=null, cur=null;
const app=document.getElementById('app');
const LS='life40_endings';
function loadEndings(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function saveEnding(id){try{const a=loadEndings();if(!a.includes(id)){a.push(id);localStorage.setItem(LS,JSON.stringify(a))}}catch(e){}}
function updCollect(){document.getElementById('collect').textContent=`모은 결말 ${loadEndings().length}/${ENDINGS.length}`}
const has=f=>S.f.includes(f);
const clamp=v=>Math.max(0,Math.min(100,v));
const won=n=>{const a=Math.abs(n);const s=a>=10000?(a/10000).toFixed(1).replace('.0','')+'억':a.toLocaleString()+'만';return (n<0?'-':'')+s+'원'};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function newGame(name,duty){
  S={name:name||'김인생',age:19,m:100,h:75,r:60,j:60,f:duty?['duty']:[],seen:[],job:'학생',save:0,log:[]};
}
function eligible(ev){
  return S.age>=ev.a[0]&&S.age<=ev.a[1]
   &&(!ev.req||ev.req.every(has))&&(!ev.x||!ev.x.some(has))
   &&(!ev.cond||ev.cond(S))
   &&(!S.seen.includes(ev.id)||['jobhunt','gongsi','startupyear','holiday','overtime'].includes(ev.id)&&!S.seen.includes(ev.id+S.age));
}
function pickEvent(){
  const el=E.filter(eligible);
  const pr=el.filter(e=>e.p);
  if(pr.length) return pr[0];
  const pool=el.filter(e=>!S.seen.includes(e.id));
  const src=pool.length?pool:el;
  if(!src.length) return null;
  return src[Math.floor(Math.random()*src.length)];
}
function applyOutcome(o,acc){
  const e=o.e||{};
  for(const k of ['m','h','r','j']) if(e[k]){acc[k]=(acc[k]||0)+e[k]}
  (o.set||[]).forEach(f=>{if(!S.f.includes(f))S.f.push(f)});
  (o.un||[]).forEach(f=>{S.f=S.f.filter(x=>x!==f)});
  if(o.job) S.job=o.job;
  if(o.save!==undefined){ if(typeof o.save==='string') S.save+=parseInt(o.save); else S.save=o.save; }
}
function choose(i){
  const ch=cur.c[i]; const acc={};
  applyOutcome(ch,acc);
  let msg=ch.m||'';
  if(ch.r){
    let x=Math.random(),sum=0,out=ch.r[ch.r.length-1];
    for(const o of ch.r){sum+=o.p;if(x<sum){out=o;break}}
    applyOutcome(out,acc); msg=out.m||msg;
  }
  S.m+=acc.m||0; S.h=clamp(S.h+(acc.h||0)); S.r=clamp(S.r+(acc.r||0)); S.j=clamp(S.j+(acc.j||0));
  S.seen.push(cur.id); S.seen.push(cur.id+S.age);
  S.log.push({age:S.age,t:`${cur.t} → ${ch.t}`});
  pending={msg,acc};
  render();
}
function nextYear(){
  pending=null;
  if(S.h<=0||S.j<=0) return end();
  // 한 해 정산
  if(has('job')){let sv=S.save;if(has('home'))sv+=300;if(has('baby'))sv-=500;if(has('pet'))sv-=100;if(has('startup'))sv+=Math.round((Math.random()-.55)*1500);S.m+=sv}
  if(S.age>=33) S.h=clamp(S.h-2);
  S.age++;
  if(S.age>40) return end();
  cur=pickEvent()||{id:'quiet'+S.age,tag:'일상',t:'조용한 한 해',d:'특별한 일 없이 한 해가 흘렀다. 그것도 나쁘지 않다.',c:[{t:'다음 해로',e:{j:2}}]};
  render();
}
function endingOf(){return ENDINGS.find(e=>e.w(S))}
function end(){
  const en=endingOf(); saveEnding(en.id); updCollect();
  S.ending=en; render();
}

// ===== 화면 =====
function gauges(){
  const g=(l,v)=>`<div class="g ${v<25?'low':''}"><span>${l}</span><div class="bar"><i style="width:${v}%"></i></div><span class="v">${v}</span></div>`;
  return `<section class="sheet status">
   <div class="stamp" aria-label="현재 나이 ${S.age}세"><div><span>만</span><b>${Math.min(S.age,40)}</b><span>세</span></div></div>
   <div class="gauges">
    <div class="job">${esc(S.name)} · ${esc(S.job)}</div>
    ${g('체력',S.h)}${g('관계',S.r)}${g('행복',S.j)}
    <div class="money"><span>통장 잔고</span><b class="${S.m<0?'neg':''}">${won(S.m)}</b></div>
   </div></section>`;
}
function logHTML(){
  if(!S.log.length) return '';
  return `<section class="sheet log"><h3>인생 기록</h3><ol>${S.log.slice().reverse().map(l=>`<li><b>${l.age}세</b><span>${esc(l.t)}</span></li>`).join('')}</ol></section>`;
}
function deltaHTML(a){
  const n={m:'돈',h:'체력',r:'관계',j:'행복'};
  const items=Object.keys(a).filter(k=>a[k]).map(k=>`<span class="d ${a[k]>0?'up':'dn'}">${n[k]} ${a[k]>0?'+':''}${k==='m'?won(a[k]):a[k]}</span>`);
  return items.length?`<div class="deltas">${items.join('')}</div>`:'';
}
function render(){
  if(!S) return renderIntro();
  if(S.ending) return renderEnd();
  let body;
  if(pending){
    body=`<section class="sheet event pop"><span class="tag">${esc(cur.tag)}</span><h2>${esc(cur.t)}</h2>
     <p class="result">${esc(pending.msg)}</p>${deltaHTML(pending.acc)}
     <button class="primary" id="next">${S.age>=40?'마흔, 결말 보기':'다음 해로 →'}</button></section>`;
  }else{
    body=`<section class="sheet event pop"><span class="tag">${S.age}세 · ${esc(cur.tag)}</span><h2><mark>${esc(cur.t)}</mark></h2><p>${esc(cur.d)}</p>
     <div class="choices">${cur.c.map((c,i)=>{const ok=!c.req||c.req.every(has);
       return `<button class="choice" data-i="${i}" ${ok?'':'disabled'}>${esc(c.t)}${(c.sub||(!ok&&c.why))?`<small>${esc(ok?c.sub:c.why)}</small>`:''}</button>`}).join('')}</div></section>`;
  }
  app.innerHTML=`<div style="display:grid;gap:16px">${gauges()}${body}${logHTML()}</div>`;
  app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const n=document.getElementById('next'); if(n){n.onclick=nextYear;n.focus({preventScroll:true})}
}
function renderIntro(){
  let duty=false;
  app.innerHTML=`<section class="sheet intro">
   <h2 style="font-size:1.7rem;margin-bottom:10px">열아홉에서 마흔까지,<br>한 번 살아 보세요</h2>
   <p>수능, 취업, 전셋집, 명절 잔소리. 한 해에 한 번씩 선택이 찾아옵니다. 돈과 체력, 관계와 행복 사이에서 저울질하며 마흔 살까지 살아남으면 나만의 결말 카드를 받습니다.</p>
   <div class="field"><label for="nm">이름</label><input id="nm" type="text" maxlength="10" placeholder="김인생"></div>
   <div class="field"><label>병역 의무</label><div class="seg" role="group" aria-label="병역 의무">
     <button id="d1" aria-pressed="false">있음 (입대 사건 포함)</button><button id="d0" aria-pressed="true">없음</button></div></div>
   <button class="primary" id="go">태어나기… 아니, 열아홉 살 되기</button></section>`;
  const d1=document.getElementById('d1'),d0=document.getElementById('d0');
  d1.onclick=()=>{duty=true;d1.setAttribute('aria-pressed','true');d0.setAttribute('aria-pressed','false')};
  d0.onclick=()=>{duty=false;d0.setAttribute('aria-pressed','true');d1.setAttribute('aria-pressed','false')};
  document.getElementById('go').onclick=()=>{newGame(document.getElementById('nm').value.trim(),duty);cur=pickEvent();render()};
}
function renderEnd(){
  const en=S.ending, age=Math.min(S.age,40);
  const early=age<40;
  const share=`[마흔까지 살아보기]\n${S.name}, ${age}세 · ${S.job}\n결말: ${en.t}\n잔고 ${won(S.m)} | 체력 ${S.h} 관계 ${S.r} 행복 ${S.j}`;
  app.innerHTML=`<div style="display:grid;gap:16px">
   <section class="card pop">
    <div class="who">${esc(S.name)} · ${age}세 · ${esc(S.job)}${early?' · 조기 종료':''}</div>
    <h2>${esc(en.t)}</h2>
    <div class="line">${esc(en.d)}</div>
    <div class="stats"><div>잔고<b>${won(S.m)}</b></div><div>체력<b>${S.h}</b></div><div>관계<b>${S.r}</b></div><div>행복<b>${S.j}</b></div></div>
   </section>
   <div class="row"><button class="primary" id="again">다시 살아보기</button><button class="ghost" id="copy">결과 복사</button></div>
   <div class="toast" id="toast" role="status"></div>
   <section class="sheet"><h3 style="font-size:1.05rem;margin-bottom:8px">결말 도감</h3>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${ENDINGS.map(e=>{const got=loadEndings().includes(e.id);return `<span class="tag" style="margin:0;${got?'color:var(--ink);border-color:var(--ink)':''}">${got?esc(e.t):'???'}</span>`}).join('')}</div></section>
   ${logHTML()}</div>`;
  document.getElementById('again').onclick=()=>{S=null;pending=null;render();window.scrollTo(0,0)};
  document.getElementById('copy').onclick=()=>{
    const t=document.getElementById('toast');
    navigator.clipboard.writeText(share).then(()=>t.textContent='결과를 복사했어요. 친구에게 붙여 넣어 보세요.')
     .catch(()=>{t.textContent=share});
  };
}
updCollect(); render();
</script>
